<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Outil Pro</title>
<style>body{font-family:system-ui;background:#fff0f5;padding:15px} .card{background:white;padding:20px;border-radius:20px;max-width:500px;margin:auto} input,textarea{width:100%;padding:15px;margin:10px 0;border:2px solid #ffb6d9;border-radius:12px;box-sizing:border-box} button{background:#e91e63;color:white;border:0;padding:16px;width:100%;border-radius:12px;font-size:18px;font-weight:bold} img{max-width:100%}</style>
</head><body><div class="card"><h2 style="text-align:center;color:#e91e63">🎁 Outil Forever Love</h2>
<input id="n" placeholder="Name: my grandmother">
<textarea id="m" rows="3" placeholder="Message: I love you so muche"></textarea>
<button onclick="G()">✨ توليد</button>
<div id="r" style="text-align:center"></div></div>
<script>function G(){let a=document.getElementById('n').value,b=document.getElementById('m').value;let l=`https://emotional-qr-shope.github.io/Love-qr/?to=${encodeURIComponent(a)}&msg=${encodeURIComponent(b)}`;let q=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(l)}`;document.getElementById('r').innerHTML=`<img src="${q}"><br><br><a href="${q}" target="_blank"><button>⬇️ حملي QR</button></a><br><br><small>${l}</small>`;}</script>
</body></html>
