<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fecfef 100%);font-family:'Segoe UI',sans-serif;padding:20px}
.card{background:white;border-radius:32px;padding:35px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25);animation:pop 0.6s ease}
@keyframes pop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.heart{font-size:72px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
h1{color:#e91e63;margin:15px 0;font-size:32px}
#photo{width:100%;border-radius:20px;margin:15px 0;display:none;max-height:400px;object-fit:cover}
#msg{color:#333;line-height:1.8;font-size:20px;white-space:pre-wrap;margin:20px 0}
#from{color:#e91e63;font-weight:bold;font-size:18px;margin-top:25px}
.small{color:#999;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1 id="title">For My Love</h1>
<img id="photo" src="">
<p id="msg">Loading your special message...</p>
<p id="from"></p>
<div class="heart" style="font-size:40px">💝</div>
<div class="small">Made with love - This message is forever 💌</div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
function getParam(name, def){
  let v = params.get(name);
  if(!v) return def;
  try{return decodeURIComponent(v)}catch{return v}
}
document.getElementById('title').innerText = "For " + getParam('to','You') + " ❤️";
document.getElementById('msg').innerText = getParam('msg','Kanbghik bzaf, you are my everything!');
document.getElementById('from').innerText = "- " + getParam('from','Forever Yours');
let photoUrl = getParam('photo','');
if(photoUrl){
  let img = document.getElementById('photo');
  img.src = photoUrl;
  img.style.display = 'block';
  img.onerror = ()=>{img.style.display='none'}
}
</script>
</body>
</html>
